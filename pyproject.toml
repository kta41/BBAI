[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbai"
version = "0.1.0"
description = "Local CLI for Bug Bounty research with Ollama models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.10.6",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.36",
  "keyring>=25.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.7.1",
  "mypy>=1.13.0",
]

[project.scripts]
bbai = "bbai.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
strict = true
